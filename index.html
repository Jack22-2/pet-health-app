<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宠物健康本 · 高保真交互原型</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --paper:#F6F1EA;          /* 舞台底色：暖纸 */
  --bg:#FAF7F2;             /* App 底色 */
  --card:#FFFFFF;
  --ink:#2A2520;
  --ink-2:#6E655C;
  --ink-3:#A99E93;
  --hairline:#EDE6DB;
  --accent:#E8764B;         /* 柿橙：主行动 */
  --accent-soft:#FCEBE3;
  --green:#3D9970;
  --green-soft:#E4F2EC;
  --amber:#D98E2B;
  --amber-soft:#FAF0DD;
  --red:#D95548;
  --red-soft:#FBE7E5;
  --blue:#4C86D9;
  --shadow:0 10px 30px rgba(60,42,28,.10);
  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;
  --safe-b:86px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, #FBF4EA 0%, transparent 60%),
    radial-gradient(900px 500px at 0% 110%, #F0E6D9 0%, transparent 55%),
    var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
ol,ul{list-style:none}

/* ============ 舞台布局 ============ */
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;padding:32px 24px}
/* 视口较矮时整体缩放设备，避免页面级滚动条 */
@media (max-height:1000px){.device-wrap{transform:scale(.86)}}
@media (max-height:880px){.device-wrap{transform:scale(.74)}}
@media (max-height:750px){.device-wrap{transform:scale(.64)}}
/* SVG 图标通用对齐 */
.ic{display:inline-block;vertical-align:-.18em;flex:none}

/* ---- 桌面验证台 ---- */
.console{width:330px;flex:none;max-height:calc(100vh - 64px);overflow:auto}
.console-brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}
.console-logo{font-size:34px;line-height:1;color:var(--accent);display:grid;place-items:center}
.console-brand h1{font-size:20px;letter-spacing:.5px}
.console-brand p{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.console-section{background:rgba(255,255,255,.72);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:16px 16px 14px;margin-bottom:14px;backdrop-filter:blur(6px)}
.console-section h2{font-size:12px;letter-spacing:1.5px;color:var(--ink-3);font-weight:700;margin-bottom:10px}
.flow-list li{margin-bottom:4px}
.flow-list button{width:100%;text-align:left;font-size:13.5px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);line-height:1.35;transition:.15s}
.flow-list button:hover{background:var(--accent-soft);color:var(--accent)}
.demo-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.demo-label{font-size:13px;color:var(--ink-2)}
#demoDate{font-size:15px;font-variant-numeric:tabular-nums}
.demo-buttons{display:flex;flex-wrap:wrap;gap:8px}
.demo-buttons.stacked{flex-direction:column;margin-top:12px}
.chip{font-size:13px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--hairline);color:var(--ink-2);transition:.15s}
.chip:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.ghost{background:transparent}
.demo-hint{font-size:12px;color:var(--ink-3);line-height:1.5;margin-top:10px}
.action-btn{width:100%;padding:11px;border-radius:var(--r-md);background:var(--ink);color:#fff;font-size:14px;font-weight:600;transition:.15s}
.action-btn:hover{background:#000}
.action-btn.ghost{background:transparent;color:var(--red);border:1px solid var(--red-soft)}
.action-btn.ghost:hover{background:var(--red-soft)}
.console-section.note ul{list-style:disc;padding-left:16px}
.console-section.note li{font-size:12px;color:var(--ink-2);line-height:1.65;margin-bottom:4px}

/* ---- 设备框 ---- */
.device-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.device{
  position:relative;width:390px;height:800px;border-radius:52px;
  background:#1C1917;padding:11px;
  box-shadow:0 40px 80px -20px rgba(80,55,30,.35),0 0 0 2px #3A332D inset;
}
.device-caption{font-size:12px;color:var(--ink-3)}
.screen{position:relative;width:100%;height:100%;border-radius:42px;background:var(--bg);overflow:hidden}
.island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:60}
.statusbar{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 32px 0 36px;font-size:15px;font-weight:600;z-index:55;color:var(--ink)}
.sb-time{padding-top:4px}
.sb-icons{display:flex;gap:6px;align-items:center;padding-top:4px;color:var(--ink)}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.85;z-index:65;pointer-events:none}

/* ============ App 通用 ============ */
#screen{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#screen::-webkit-scrollbar{display:none}
.page{min-height:100%;padding:60px 18px var(--safe-b);animation:pageIn .28s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.large-title{font-size:30px;font-weight:800;letter-spacing:.3px}
.large-title .sub{display:block;font-size:13px;font-weight:500;color:var(--ink-3);margin-top:4px;letter-spacing:0}
.section-title{font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:1px;margin:22px 4px 10px;text-transform:uppercase}

.card{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:0 2px 12px rgba(90,70,45,.05)}
.card + .card{margin-top:12px}
.hairline{height:1px;background:var(--hairline);margin:12px 0}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.muted{color:var(--ink-2)}
.tiny{font-size:12px;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-size:16px;font-weight:700;background:var(--accent);color:#fff;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:#fff;border:1.5px solid var(--hairline);color:var(--ink)}
.btn.small{padding:10px 14px;font-size:14px;border-radius:12px;width:auto}
.btn:disabled{opacity:.5}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.due{background:var(--red-soft);color:var(--red)}
.badge.info{background:#EAF1FB;color:var(--blue)}

/* ---- 宠物 chips ---- */
.pet-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.pet-chips::-webkit-scrollbar{display:none}
.pet-chip{flex:none;display:flex;align-items:center;gap:7px;padding:7px 14px 7px 8px;border-radius:999px;background:#fff;border:1.5px solid var(--hairline);font-size:14px;font-weight:600;color:var(--ink-2);transition:.15s}
.pet-chip.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pet-chip .avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.pet-chip.add{border-style:dashed;color:var(--ink-3)}

.avatar{border-radius:50%;display:grid;place-items:center;flex:none;user-select:none}
.pet-chip .avatar{width:22px;height:22px}
.avatar.cat{background:#FBE3D2;color:#D96C3F}
.avatar.dog{background:#E3EDDA;color:#7A9B63}
.avatar.other{background:#E7E4F0;color:#8E7BB8}
.avatar.lg{width:58px;height:58px;font-size:30px}
.avatar.md{width:42px;height:42px;font-size:22px}
/* 紧凑宠物卡 + 资料图标按钮 */
.pet-card{background:var(--card);border-radius:var(--r-lg);padding:10px 12px;box-shadow:0 2px 12px rgba(90,70,45,.05);align-items:center;gap:10px}
.pet-card .pc-name{font-size:15.5px;font-weight:800}
.icon-btn{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}

/* ---- 紧急提醒横幅 ---- */
.urgent{border-radius:var(--r-lg);padding:20px 18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 12px 26px rgba(60,42,28,.16)}
.urgent.due{background:linear-gradient(135deg,#E86353,#D95548);box-shadow:0 12px 26px rgba(217,85,72,.32)}
.urgent.warn{background:linear-gradient(135deg,#E8A33D,#D98E2B);box-shadow:0 12px 26px rgba(217,142,43,.30)}
.urgent.ok{background:var(--green-soft);color:var(--green);box-shadow:none;padding:14px 16px}
.urgent.ok h3{font-size:15px}
.urgent.ok p{opacity:.8}
.urgent.ok .u-emoji{color:rgba(61,153,112,.22)}
.urgent.ok .u-actions button{background:rgba(61,153,112,.12);color:var(--green);backdrop-filter:none}
.urgent.ok .u-actions button.primary{background:var(--green);color:#fff}
.urgent h3{font-size:18px;font-weight:800}
.urgent p{font-size:13px;opacity:.92;margin-top:3px;line-height:1.45}
.urgent .u-actions{display:flex;gap:8px;margin-top:13px}
.urgent .u-actions button{flex:1;padding:9px;border-radius:11px;font-size:13.5px;font-weight:700;background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(4px)}
.urgent .u-actions button.primary{background:#fff;color:var(--ink)}
.urgent .u-emoji{position:absolute;right:12px;top:10px;color:rgba(255,255,255,.35)}

.notify-denied{background:var(--amber-soft);border:1px solid #EEDCB8;border-radius:var(--r-md);padding:11px 13px;font-size:12.5px;color:#8A5A17;line-height:1.5;margin-bottom:12px;display:flex;gap:8px;align-items:center}

/* ---- 时间线 ---- */
.tl{position:relative;padding-left:6px}
.tl-item{position:relative;padding:0 0 16px 30px}
.tl-item:before{content:"";position:absolute;left:7px;top:6px;bottom:-2px;width:2px;background:var(--hairline)}
.tl-item:last-child:before{display:none}
.tl-dot{position:absolute;left:0;top:2px;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--hairline)}
.tl-dot.vaccine{background:var(--blue)}
.tl-dot.deworm{background:var(--green)}
.tl-dot.visit{background:var(--amber)}
.tl-dot.weight{background:#8E7BB8}
.tl-dot.due{background:var(--red)}
.tl-card{background:#fff;border-radius:var(--r-md);padding:13px 14px;box-shadow:0 2px 10px rgba(90,70,45,.05);position:relative}
.tl-del{position:absolute;top:6px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:var(--ink-3);opacity:0;transition:.15s}
.tl-card:hover .tl-del,.tl-del:focus-visible{opacity:1;background:var(--red-soft);color:var(--red)}
@media (hover:none){.tl-del{opacity:.45}}
.tl-card .tl-name{font-size:15px;font-weight:700}
.tl-card .tl-meta{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}
.tl-name .ic{color:var(--ink-3);vertical-align:-2px;margin-right:2px}
.tl-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--hairline);flex:none}

.empty{text-align:center;padding:56px 24px}
.empty .paw{font-size:46px;color:var(--ink-3);opacity:.55}
.empty h3{font-size:16px;margin:12px 0 4px}
.empty p{font-size:13px;color:var(--ink-3);line-height:1.5;margin-bottom:18px}

/* ---- 底部 Tab ---- */
.tabbar{position:absolute;left:11px;right:11px;bottom:11px;height:72px;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-top:1px solid var(--hairline);border-radius:0 0 38px 38px;display:flex;z-index:50;padding-bottom:8px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--ink-3);font-weight:600}
.tab.active{color:var(--accent)}
.tab svg{width:24px;height:24px}
.tab-fab{width:54px;height:54px;margin-top:-22px;border-radius:50%;background:linear-gradient(135deg,#EF8A62,#E8764B);display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px rgba(232,118,75,.45);transition:transform .12s}
.tab-fab:active{transform:scale(.92) rotate(90deg)}

/* ============ 引导页 ============ */
.onboard{height:100%;display:flex;flex-direction:column;padding:72px 28px 36px;background:linear-gradient(180deg,#FDF6EF 0%,#FAF7F2 55%)}
.onboard .hero{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center}
.onboard .hero-emoji{font-size:76px;color:var(--accent);display:flex;justify-content:center;animation:float 3.2s ease-in-out infinite}
.pillar .e{color:var(--accent);display:flex;justify-content:center}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.onboard h1{font-size:28px;font-weight:800;margin:22px 0 10px;line-height:1.3}
.onboard .lead{font-size:14.5px;color:var(--ink-2);line-height:1.7}
.onboard .pillars{display:flex;gap:10px;margin:26px 0 8px}
.onboard .pillar{flex:1;background:#fff;border-radius:16px;padding:14px 8px;box-shadow:0 2px 10px rgba(90,70,45,.05)}
.onboard .pillar .e{font-size:26px}
.onboard .pillar b{display:block;font-size:13px;margin:7px 0 3px}
.onboard .pillar span{font-size:11px;color:var(--ink-3);line-height:1.4;display:block}
.onboard .foot{padding-bottom:18px}
.onboard .fine{text-align:center;font-size:11px;color:var(--ink-3);margin-top:12px;line-height:1.6}

/* ============ 表单 ============ */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 4px 7px}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
  width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--hairline);background:#fff;outline:none;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:none;height:72px}
/* 中文化日期字段 */
.date-field{position:relative}
.date-display{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--hairline);background:#fff;font-size:15px;color:var(--ink);text-align:left;transition:border .15s}
.date-display:active{border-color:var(--accent)}
.date-display .ic{color:var(--ink-3)}
.date-display .ph{color:var(--ink-3)}
input.vh{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:0;bottom:0}
.seg{display:flex;background:#F1ECE3;border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.choice-row{display:flex;gap:8px;flex-wrap:wrap}
.choice{padding:9px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--hairline);font-size:13.5px;font-weight:600;color:var(--ink-2)}
.choice.active{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* ---- 导航栏（内页，吸顶） ---- */
.navi{position:sticky;top:54px;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:40;margin:0 -18px 8px;background:var(--bg)}
.navi.navi-dark{margin:0;background:#211D1A;padding:0 22px}
.navi .nv-title{font-size:16px;font-weight:700}
.navi button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--ink)}
.navi .nv-action{width:auto;padding:0 10px;height:34px;font-size:14.5px;font-weight:600;color:var(--accent)}
.page.navi-page{padding-top:108px}

/* ---- 拍照识别 ---- */
.cam{height:100%;background:#211D1A;color:#fff;display:flex;flex-direction:column;padding:108px 22px 36px}
.cam-frame{flex:1;border-radius:26px;border:2px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;position:relative;background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 12px,transparent 12px 24px)}
.cam-frame.has-img{border-style:solid;border-color:rgba(255,255,255,.15)}
.cam-frame img{width:100%;height:100%;object-fit:contain}
.cam-frame .cam-emoji{font-size:58px;color:#E9DFC8;display:flex;justify-content:center}
.cam-frame p{font-size:13.5px;opacity:.7;text-align:center;line-height:1.6;padding:0 24px}
.cam-actions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.cam .btn.secondary{background:rgba(255,255,255,.14);color:#fff}
.scan-line{position:absolute;left:8%;right:8%;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#7FE0B0,transparent);box-shadow:0 0 16px #7FE0B0;animation:scan 1.6s ease-in-out infinite}
@keyframes scan{0%{top:8%}50%{top:88%}100%{top:8%}}
.scan-status{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:13px;color:#BFE8D2;font-weight:600;letter-spacing:1px}

/* ---- 识别草稿确认 ---- */
.ocr-thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--hairline)}
.auto-card{background:linear-gradient(135deg,#F2FAF6,#E9F5EF);border:1.5px solid #BFE2D0;border-radius:var(--r-lg);padding:16px;margin:14px 0}
.auto-card .auto-label{font-size:12px;font-weight:700;color:var(--green);letter-spacing:1px}
.auto-card .auto-date{font-size:30px;font-weight:800;color:var(--green);margin:4px 0 2px;font-variant-numeric:tabular-nums}
.auto-card p{font-size:12px;color:var(--green);opacity:.85;line-height:1.5}
.ocr-tag{display:inline-flex;align-items:center;gap:5px;background:#EAF1FB;color:var(--blue);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:12px}

/* ---- 成功弹层 ---- */
.success-pop{text-align:center;padding:30px 24px 8px}
.success-pop .check{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--green-soft);display:grid;place-items:center;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.success-pop .check svg{width:44px;height:44px}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.success-pop h3{font-size:19px;margin-bottom:6px}
.success-pop p{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.success-next{background:var(--amber-soft);border-radius:14px;padding:13px;margin:16px 0 6px;font-size:13.5px;color:#8A5A17;line-height:1.6;text-align:left}
.success-next b{color:var(--amber)}

/* ============ 弹层 Sheet ============ */
.sheet-mask{position:absolute;inset:0;background:rgba(30,22,15,.42);z-index:70;animation:fade .2s ease;border-radius:42px}
.sheet{position:absolute;left:11px;right:11px;bottom:11px;max-height:82%;background:var(--bg);border-radius:28px 28px 0 0;z-index:71;padding:8px 18px 30px;overflow-y:auto;animation:sheetUp .32s cubic-bezier(.2,.85,.25,1);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
@keyframes fade{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:#DCD3C6;margin:6px auto 16px}
.sheet h3{font-size:18px;font-weight:800;margin:2px 2px 14px}

.action-list{background:#fff;border-radius:16px;overflow:hidden}
.action-list button{width:100%;display:flex;align-items:center;gap:13px;padding:15px 16px;font-size:15.5px;text-align:left;border-bottom:1px solid var(--hairline)}
.action-list button:last-child{border-bottom:none}
.action-list button:active{background:#F7F2EA}
.action-list .al-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.action-list .al-icon.v{background:#EAF1FB;color:var(--blue)}
.action-list .al-icon.d{background:var(--green-soft);color:var(--green)}
.action-list .al-icon.m{background:var(--amber-soft);color:var(--amber)}
.action-list .al-icon.w{background:#EFEAF8;color:#8E7BB8}
.action-list small{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}

/* ============ 出示模式 ============ */
.present{position:absolute;inset:0;z-index:80;background:#FBF8F3;padding:10px 24px 40px;overflow-y:auto;animation:pageIn .3s ease}
/* 遮罩内自带状态栏，与设备状态栏视觉一致 */
.ov-statusbar{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 18px;font-size:15px;font-weight:600;color:var(--ink)}
.ov-statusbar .sb-icons{display:inline-flex;gap:5px;align-items:center}
.present-head{display:flex;align-items:center;gap:14px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.present-head h2{font-size:24px;font-weight:800;letter-spacing:2px}
.present-head .p-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.present table{width:100%;border-collapse:collapse;margin-top:8px}
.present th{font-size:12px;color:var(--ink-3);text-align:left;padding:10px 6px;border-bottom:1.5px solid var(--ink);letter-spacing:1px}
.present td{font-size:14.5px;padding:13px 6px;border-bottom:1px solid var(--hairline);vertical-align:top}
.present td.date{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.present td:nth-child(3),.present th:nth-child(3){max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--ink-2)}
.present .p-disclaimer{margin-top:22px;padding-top:14px;border-top:2px solid var(--ink);font-size:11.5px;color:var(--ink-2);line-height:1.7;text-align:center}
.present .p-stamp{margin:18px auto 0;width:fit-content;border:2px solid var(--red);color:var(--red);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;transform:rotate(-6deg);opacity:.8;letter-spacing:2px}

/* ============ 付费墙 ============ */
.paywall{position:absolute;inset:0;z-index:80;background:linear-gradient(180deg,#FDF1E8,#FAF7F2 45%);padding:10px 24px 34px;display:flex;flex-direction:column;animation:pageIn .3s ease;overflow-y:auto}
.paywall .pw-close{position:absolute;top:12px;right:20px;width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.paywall .pw-emoji{font-size:52px;text-align:center;color:var(--accent);display:flex;justify-content:center}
.paywall h2{font-size:25px;font-weight:800;text-align:center;margin:14px 0 6px}
.paywall .pw-lead{text-align:center;font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-bottom:20px}
.pw-feats{background:#fff;border-radius:20px;padding:6px 18px;margin-bottom:18px}
.pw-feat{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--hairline);font-size:14px}
.pw-feat:last-child{border-bottom:none}
.pw-feat .tick{width:24px;height:24px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:13px;flex:none;font-weight:800}
.pw-feat small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.pw-price{text-align:center;margin-bottom:14px}
.pw-price .big{font-size:40px;font-weight:800}
.pw-price .once{font-size:13px;color:var(--green);font-weight:700;letter-spacing:1px}
.pw-foot{margin-top:auto;padding-top:10px}
.pw-foot .fine{font-size:10.5px;color:var(--ink-3);text-align:center;margin-top:10px;line-height:1.6}
.restore{display:block;margin:10px auto 0;font-size:13px;color:var(--ink-2);text-decoration:underline}

/* ---- 小组件预览 ---- */
.widget-mock{background:linear-gradient(160deg,#4A4138,#2E2823);border-radius:26px;padding:18px;display:flex;gap:14px;justify-content:center;align-items:center;min-height:170px}
.widget-card{width:148px;height:148px;border-radius:20px;background:#fff;padding:14px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.widget-card.sm{width:70px;height:70px;border-radius:16px;padding:10px;align-items:center;justify-content:center;text-align:center}
.widget-card .w-top{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.5px}
.widget-card .w-pet{font-size:13px;font-weight:700;margin-top:8px}
.widget-card .w-big{font-size:26px;font-weight:800;margin-top:auto;color:var(--accent)}
.widget-card .w-name{font-size:11px;color:var(--ink-2)}
.widget-lock{position:absolute;inset:0;background:rgba(255,255,255,.55);backdrop-filter:blur(2px);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-2);gap:4px}

/* ---- 推送横幅 ---- */
.push-banner{position:absolute;top:62px;left:22px;right:22px;background:rgba(250,248,245,.92);backdrop-filter:blur(20px);border-radius:18px;padding:12px 14px;display:flex;gap:11px;z-index:90;box-shadow:0 12px 30px rgba(60,42,28,.22);animation:pushIn .5s cubic-bezier(.2,1.1,.3,1)}
@keyframes pushIn{from{transform:translateY(-130%)}to{transform:none}}
.push-icon{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px}
.push-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700}
.push-head .push-time{color:var(--ink-3);font-weight:500}
.push-body p{font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.4}

/* ---- Toast ---- */
.toast{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(35,30,26,.92);color:#fff;font-size:13.5px;padding:11px 20px;border-radius:999px;z-index:95;white-space:nowrap;animation:fade .2s ease}

/* ---- 设置列表 ---- */
.set-group{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:12px}
.set-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--hairline);font-size:14.5px}
.set-item:last-child{border-bottom:none}
.set-item .si-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;background:var(--accent-soft);color:var(--accent)}
.set-item .si-val{margin-left:auto;font-size:13px;color:var(--ink-3)}
.toggle{width:46px;height:28px;border-radius:999px;background:#DCD6CC;position:relative;transition:.2s;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--green)}
.toggle.on:after{left:21px}

/* ============ 响应式 ============ */
@media (max-width:900px){
  .stage{flex-direction:column-reverse;gap:18px;padding:16px 12px 40px}
  .console{width:100%;max-width:390px;max-height:none;order:2}
  .device{transform:scale(.92);transform-origin:top center;margin-bottom:-58px}
}
@media (max-width:400px){
  .device{transform:scale(.82);margin-bottom:-128px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<div class="stage">

          <svg viewBox="0 0 16 12" width="16" height="12" fill="currentColor"><path d="M8 2.5c2.1 0 4 .8 5.5 2.2l1.2-1.3C12.8 1.5 10.5.7 8 .7S3.2 1.5 1.3 3.4l1.2 1.3C4 3.3 5.9 2.5 8 2.5z"/><path d="M8 6c1.1 0 2.1.4 2.9 1.1l1.2-1.3C11 4.7 9.5 4.1 8 4.1S5 4.7 3.9 5.8l1.2 1.3C5.9 6.4 6.9 6 8 6z"/><circle cx="8" cy="9.6" r="1.6"/></svg>
          <svg viewBox="0 0 26 13" width="26" height="13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" stroke-opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="2" height="5" rx="1" fill="currentColor" fill-opacity=".4"/></svg>

function icon(name,size,sw){ return `<svg class="ic" width="${size||20}" height="${size||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||1.8}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]||''}</svg>`; }

/* ---------- 中文化日期字段（readonly 显示 + 原生选择器） ---------- */
function fmtDateCN(s){ const d=parseD(s); return d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日'; }
function dateField(id,val,max,min){
  return `<div class="date-field"><button type="button" class="date-display" id="${id}-disp"><span id="${id}-text"${val?'':' class="ph"'}>${val?fmtDateCN(val):'选择日期'}</span>${icon('calendar',16)}</button><input type="date" id="${id}" class="vh" value="${val||''}"${max?` max="${max}"`:''}${min?` min="${min}"`:''} tabindex="-1" aria-hidden="true"></div>`;
}
function bindDateField(id,onChange){
  const inp=document.getElementById(id), disp=document.getElementById(id+'-disp'), txt=document.getElementById(id+'-text');
  if(!inp||!disp) return;
  disp.onclick=()=>{ try{ inp.showPicker(); }catch(e){ inp.classList.remove('vh'); inp.focus(); } };
  inp.onchange=()=>{ if(inp.value){ txt.textContent=fmtDateCN(inp.value); txt.classList.remove('ph'); } if(onChange) onChange(inp.value); };
}

/* ---------- 领域常量：周期表（默认建议值，遵兽医医嘱） ---------- */

function defaultState(){
  return {
    onboarded:false, purchased:false, offsetDays:0,
    pets:[], records:[],
    settings:{ notify:true, leadDays:[7,1] },
    fired:{},
  };
}
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return Object.assign(defaultState(), JSON.parse(raw)); }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){ toast('存储空间已满：请先删除带照片的记录'); } }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- 日期工具 ---------- */
function today(){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+S.offsetDays); return d; }
function parseD(s){ const d=new Date(s+'T00:00:00'); return d; }
function fmt(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtCN(s){ const d=parseD(s); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
/* 月末安全：1/31 + 1 月 → 2 月最后一天，而不是 3/3 */
function addMonths(s,m){ const d=parseD(s); const day=d.getDate(); d.setMonth(d.getMonth()+m); if(d.getDate()!==day){ d.setDate(0); } return fmt(d); }
function diffDays(aStr,b){ const a=parseD(aStr); return Math.round((a-b)/86400000); } // a - today
function ageText(birthday){
  if(!birthday) return '';
  const months=(today().getFullYear()-parseD(birthday).getFullYear())*12 + today().getMonth()-parseD(birthday).getMonth();
  if(months<1) return '不到 1 个月';
  if(months<12) return months+' 个月';
  const y=Math.floor(months/12), m=months%12;
  return m? y+' 岁 '+m+' 个月' : y+' 岁';
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 派生：提醒状态 ---------- */
function activePet(){ return S.pets.find(p=>p.id===view.activePetId) || S.pets[0]; }
function remindersFor(petId){
  const lead = Math.max(...S.settings.leadDays, 0);
  return S.records
    .filter(r=>r.petId===petId && r.nextDue && !r.done)
    .map(r=>{
      const d = diffDays(r.nextDue, today());
      let bucket='ok', text='';
      if(d<0){ bucket='due'; text='已逾期 '+(-d)+' 天'; }
      else if(d===0){ bucket='due'; text='今天到期'; }
      else if(d<=lead){ bucket='warn'; text='还有 '+d+' 天到期'; }
      else text='还有 '+d+' 天';
      return {...r, diff:d, bucket, statusText:text};
    })
    .sort((a,b)=>a.nextDue.localeCompare(b.nextDue));
}
function mostUrgent(petId){
  return remindersFor(petId).find(r=>r.bucket==='due') || remindersFor(petId).find(r=>r.bucket==='warn') || null;
}
/* 给任意记录补充提醒状态，供时间线/最近记录渲染徽标 */
function withStatus(r){
  if(r.done) return {...r, bucket:'done', statusText:''};
  if(!r.nextDue) return {...r, bucket:'ok', statusText:''};
  const d=diffDays(r.nextDue, today());
  const lead=Math.max(...S.settings.leadDays,0);
  if(d<0) return {...r,bucket:'due',statusText:'已逾期 '+(-d)+' 天'};
  if(d===0) return {...r,bucket:'due',statusText:'今天到期'};
  if(d<=lead) return {...r,bucket:'warn',statusText:'还有 '+d+' 天到期'};
  return {...r,bucket:'ok',statusText:'还有 '+d+' 天'};
}

/* ---------- 模拟推送：同一记录进入新状态桶时弹一次 ---------- */
function fireReminders(){
  if(!S.settings.notify) return;
  const all = S.pets.flatMap(p=>remindersFor(p.id)).filter(r=>r.bucket!=='ok');
  for(const r of all){
    const key = r.id+':'+r.bucket;
    if(!S.fired[key]){
      S.fired[key]=true; save();
      const pet = S.pets.find(p=>p.id===r.petId);
      showPush((pet?pet.name+' · ':'')+r.name+'，'+r.statusText);
      break; // 每次渲染最多一条
    }
  }
}
let pushTimer=null;
function showPush(text){
  const b=document.getElementById('pushBanner');
  document.getElementById('pushText').textContent=text;
  b.hidden=false;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{ b.hidden=true; },4500);
}
function toast(text){
  const t=document.getElementById('toast'); t.textContent=text; t.hidden=false;
  clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true,1800);
}

    `<button class="tab" data-act="add-menu" aria-label="记一笔"><span class="tab-fab"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>`+

/* ---------- 总渲染 ---------- */
function render(){
  renderChrome();
  closeSheet(false);
  $screen.style.background='';
  if(!S.onboarded && view.page!=='petForm'){ $screen.innerHTML = viewOnboarding(); bindOnboarding(); updateConsole(); return; }
  if(!activePet()){ view.activePetId=null; }
  if(view.page==='camera'){ $screen.style.background='#211D1A'; $screen.innerHTML=viewCamera(); bindCamera(); updateConsole(); return; }
  if(view.page==='ocrConfirm'){ $screen.innerHTML=viewOcrConfirm(); bindOcrConfirm(); updateConsole(); return; }
  if(view.page==='recordForm'){ $screen.innerHTML=viewRecordForm(); bindRecordForm(); updateConsole(); return; }
  if(view.page==='visitForm'){ $screen.innerHTML=viewVisitForm(); bindVisitForm(); updateConsole(); return; }
  if(view.page==='weightForm'){ $screen.innerHTML=viewWeightForm(); bindWeightForm(); updateConsole(); return; }
  if(view.page==='petForm'){ $screen.innerHTML=viewPetForm(); bindPetForm(); updateConsole(); return; }

  if(view.tab==='health') $screen.innerHTML=viewHealth();
  else if(view.tab==='present'){ $screen.innerHTML=''; openPresent(); updateConsole(); return; }
  else if(view.tab==='me') $screen.innerHTML=viewMe();
  else $screen.innerHTML=viewHome();
  bindCommon();
  updateConsole();
  fireReminders();
}

  $screen.querySelector('#pf-save').onclick=()=>{
    d.name=$screen.querySelector('#pf-name').value.trim();

    d.birthday=$screen.querySelector('#pf-birthday').value;
    d.weight=parseFloat($screen.querySelector('#pf-weight').value)||null;

function urgentCard(pet){

    <span class="tl-dot ${meta.dot}"></span>

/* 照片压缩：长边 ≤1280px、JPEG 0.7，避免 base64 撑爆 localStorage 配额 */
function compressImage(src,cb){
  const img=new Image();
  img.onload=()=>{
    const MAX=1280; let w=img.width, h=img.height;
    if(Math.max(w,h)>MAX){ const r=MAX/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
    try{
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.7));
    }catch(e){ cb(src); }
  };
  img.onerror=()=>cb(src);
  img.src=src;
}
function bindCamera(){
  const frame=$screen.querySelector('#camFrame');
  const runOCR=(src)=>{
    frame.classList.add('has-img');
    frame.innerHTML=`<img src="${src}" alt="疫苗本"><div class="scan-line"></div><div class="scan-status" id="scanStatus">正在识别…</div>`;
    const msgs=['正在识别文字…','提取接种项目与日期…','计算下次到期日…'];
    let i=0; const t=setInterval(()=>{ const el=document.getElementById('scanStatus'); if(el&&msgs[++i]) el.textContent=msgs[i]; },550);
    setTimeout(()=>{ clearInterval(t); ocrDraft=mockOCR(src); view.page='ocrConfirm'; render(); },1900);
  };
  $screen.querySelector('#camShoot').onclick=()=>document.getElementById('camFile').click();
  $screen.querySelector('#camFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const rd=new FileReader(); rd.onload=()=>compressImage(rd.result, runOCR); rd.readAsDataURL(f);
  };
  $screen.querySelector('#camSample').onclick=()=>runOCR(sampleBookURI());
}

/* ================= 周期操作：完成 / 改期 ================= */
function completeRecord(id){
  const r=S.records.find(x=>x.id===id); if(!r)return;
  r.done=true; r.nextDue=null; // 旧记录收尾，避免与新生成的下一周期记录重复显示
  if(r.cycleMonths){
    const t=fmt(today());
    S.records.push({id:uid(),petId:r.petId,kind:r.kind,name:r.name,date:t,place:r.place,
      cycleMonths:r.cycleMonths,nextDue:addMonths(t,r.cycleMonths),note:r.note,photo:null,done:false});
  }
  save(); render();
  toast('已完成，下一周期已排好');
}
function openReschedule(id){
  const r=S.records.find(x=>x.id===id);
  openSheet(`<h3>改期 · ${esc(r.name)}</h3>
    <p class="tiny" style="margin:-6px 2px 12px">调整后将按新日期重新安排提醒。</p>
    <div class="field"><label>新的到期日</label>${dateField('rs-date',r.nextDue,null,fmt(today()))}</div>
    <button class="btn" id="rs-save">保存改期</button>
    <div style="height:10px"></div>
    <button class="btn ghost" data-act="sheet-close">取消</button>`);
  bindDateField('rs-date');
  document.getElementById('rs-save').onclick=()=>{
    const v=document.getElementById('rs-date').value;
    if(!v)return;
    r.nextDue=v;
    Object.keys(S.fired).forEach(k=>{ if(k.startsWith(r.id+':')) delete S.fired[k]; });
    save(); closeSheet(); render(); toast('已改期');
  };
}

/* ================= Sheet 工具 ================= */
const $sheet=document.getElementById('sheet'), $mask=document.getElementById('sheetMask');
function openSheet(html){
  $sheet.innerHTML=`<div class="sheet-handle"></div>${html}`;
  $sheet.hidden=false; $mask.hidden=false;
}
function closeSheet(saveNeeded){
  $sheet.hidden=true; $mask.hidden=true; $sheet.innerHTML='';
}
$mask.addEventListener('click',()=>closeSheet());

/* ================= 全局事件 ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const act=t.dataset.act, id=t.dataset.id;
  switch(act){
    case 'back': view.page=null; render(); break;
    case 'back-camera': view.page='camera'; render(); break;
    case 'sheet-close': closeSheet(); break;
    case 'tab': view.tab=t.dataset.tab; view.page=null; render(); break;
    case 'add-menu': openAddMenu(); break;
    case 'go-camera': closeSheet(); view.page='camera'; render(); break;
    case 'go-record': closeSheet(); recordDraft=null; view.page='recordForm'; render(); break;
    case 'go-visit': closeSheet(); view.page='visitForm'; render(); break;
    case 'go-weight': closeSheet(); view.page='weightForm'; render(); break;
    case 'complete': completeRecord(id); break;
    case 'reschedule': openReschedule(id); break;
    case 'del-record': {
      S.records=S.records.filter(x=>x.id!==id);
      Object.keys(S.fired).forEach(k=>{ if(k.startsWith(id+':')) delete S.fired[k]; });
      save(); render(); toast('已删除'); break; }
    case 'add-pet':
      if(!S.purchased && S.pets.length>=1){ pendingAction=()=>{ petFormMode='create'; petDraft={}; view.page='petForm'; render(); }; openPaywall(); }
      else { petFormMode='create'; petDraft={}; view.page='petForm'; render(); }
      break;
    case 'edit-pet': petFormMode='edit'; petFormEditingId=id; petDraft={...S.pets.find(p=>p.id===id)}; view.page='petForm'; render(); break;
    case 'paywall': pendingAction=null; openPaywall(); break;
    case 'toggle-notify': S.settings.notify=!S.settings.notify; save(); render(); break;
    case 'enable-notify': S.settings.notify=true; save(); render(); toast('通知已开启'); break;
    case 'toggle-lead': {
      const d=+t.dataset.d, arr=S.settings.leadDays;
      const i=arr.indexOf(d); i>=0?arr.splice(i,1):arr.push(d);
      if(!arr.length) arr.push(7);
      save(); render(); break; }
  }
});
/* 宠物切换 */
$screen.addEventListener('click',e=>{
  const t=e.target.closest('[data-pet]');
  if(t){ view.activePetId=t.dataset.pet; render(); }
},true);

/* ESC 关闭弹层 / 全屏遮罩 */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(!$sheet.hidden){ closeSheet(); return; }
  const overlay=document.querySelector('.present,.paywall');
  if(overlay){
    if(overlay.classList.contains('present') && view.tab==='present') view.tab='home';
    closeOverlay(); pendingAction=null; render();
  }
});

/* ================= 桌面验证台 ================= */
function updateConsole(){
  document.getElementById('demoDate').textContent=fmt(today())+'（第 '+(S.offsetDays>=0?'+':'')+S.offsetDays+' 天）';
}
document.getElementById('flowList').onclick=e=>{
  const b=e.target.closest('[data-flow]'); if(!b)return;
  closeOverlay();
  const f=b.dataset.flow;
  if(f==='onboarding'){ resetAll(false); render(); return; }
  if(!S.onboarded || !S.pets.length) loadSample(false);
  view.page=null; view.tab='home'; view.activePetId=S.pets[0].id;
  if(f==='record-ocr'){ view.page='camera'; render(); return; }
  if(f==='reminder'){
    // 重置 fired，确保横幅重新演示
    S.fired={}; S.offsetDays=5; save(); render(); return;
  }
  if(f==='present'){ save(); render(); setTimeout(openPresent,60); return; }
  if(f==='paywall'){ save(); render();
    // 买断成功后继续进入「添加第 2 只宠物」表单，补齐演示链路
    setTimeout(()=>{ if(!S.purchased && S.pets.length>=1){ pendingAction=()=>{ petFormMode='create'; petDraft={}; view.page='petForm'; render(); }; } openPaywall(); },60);
    return; }
  render();
};
document.querySelectorAll('.chip[data-days]').forEach(b=>{
  b.onclick=()=>{
    const v=b.dataset.days;
    if(v==='reset') S.offsetDays=0; else S.offsetDays+=+v;
    save(); render();
  };
});
document.getElementById('loadSample').onclick=()=>loadSample(true);
document.getElementById('resetAll').onclick=()=>resetAll(true);

function closeOverlay(){ document.querySelectorAll('.present,.paywall').forEach(el=>el.remove()); }

/* ---------- 示例数据：布丁 ---------- */
function loadSample(doRender=true){
  const t=today();
  const iso=fmt(t);
  const pet={id:'sample-pet',name:'布丁',species:'cat',breed:'英国短毛猫',
    birthday:fmt(new Date(t.getFullYear()-2,t.getMonth()-3,10)),gender:'female',weight:4.2};
  const mk=(id,kind,name,date,cycle,extra={})=>({id,petId:pet.id,kind,name,date,
    nextDue:cycle?addMonths(date,cycle):null,cycleMonths:cycle,done:false,...extra});
  S={...defaultState(),onboarded:true,
    pets:[pet],
    records:[
      mk('r1','deworm_out','体外驱虫滴剂',fmt(new Date(t.getTime()-26*86400000)),1,{place:'家 · 自行上药'}),
      mk('r2','vaccine','猫三联',fmt(new Date(t.getTime()-7*86400000)),12,{place:'伴侣动物医院',photo:sampleBookURI()}),
      mk('r3','deworm_in','体内驱虫药',fmt(new Date(t.getTime()-65*86400000)),3,{place:'伴侣动物医院'}),
      mk('r4','vaccine','狂犬疫苗',fmt(new Date(t.getTime()-400*86400000)),12,{done:true,nextDue:null,place:'伴侣动物医院'}),
      {id:'r5',petId:pet.id,kind:'visit',name:'年度体检',date:fmt(new Date(t.getTime()-7*86400000)),
        reason:'年度体检',diagnosis:'一切正常，建议控制体重',cost:480,photo:null,done:false,nextDue:null,cycleMonths:0},
      {id:'r6',petId:pet.id,kind:'weight',name:'体重 4.2kg',date:fmt(new Date(t.getTime()-7*86400000)),weightVal:4.2,photo:null,done:false,nextDue:null,cycleMonths:0},
    ],
    fired:{}};
  view.activePetId=pet.id; view.page=null; view.tab='home';
  save(); if(doRender) render();
}
function resetAll(doRender=true){
  S=defaultState(); view={tab:'home',page:null,activePetId:null};
  localStorage.removeItem(STORE_KEY);
  closeOverlay();
  if(doRender) render();
}

/* ---------- 启动 ---------- */
if(S.onboarded && S.pets.length && !view.activePetId) view.activePetId=S.pets[0].id;
render();

</script>
